# Mechanical test only: three scheduling boundaries and one frozen tail.
held_out_backends: [mujoco]
backends:
  motrix: {device: cpu, timeout_s: 300}
  drake: {device: cpu, timeout_s: 300}
  mjwarp: {device: 'cuda:0', timeout_s: 600}
  isaacgym: {device: 'cuda:0', timeout_s: 600}
  isaacsim: {device: 'cuda:0', timeout_s: 600}
  genesis: {device: 'cuda:0', timeout_s: 600}
  newton: {device: 'cuda:0', timeout_s: 600}
adaptive:
  metric: mean_step_reward
  strategy: low_reward
  interval: 1
  warmup: 0
  ema_alpha: 0.5
  min_ratio: 0.05
  max_ratio: 0.5
  smoothing: 1.0
  freeze_after: 3
