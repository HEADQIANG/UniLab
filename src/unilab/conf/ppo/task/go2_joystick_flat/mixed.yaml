# @package _global_
# Shared policy/task semantics for every mixed Go2 worker and eval profile.
defaults:
  - /task/go2_joystick_flat/mujoco
  - _self_

training:
  sim_backend: mixed
  no_play: true
  play_render_mode: none
  mix_task: go2_joystick_flat
  mix_ratios: null
  mix_config: null

algo:
  runtime_resolver: uni_rl.algos.mixed_ppo:resolve_mixed_ppo_runtime

env:
  events:
    # These are the base task's only physical randomization/reset mutations.
    reset_root_state_uniform: null
    pd_gains: null

reward:
  # Contact-frame force semantics are not shared by all supported backends.
  contact: null
